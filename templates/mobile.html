<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/m/manifest.webmanifest">
  <meta name="theme-color" content="#0f3d4c">
  <title>My Attendance</title>
  <style>
    :root {
      --ink: #143044;
      --muted: #5d7384;
      --line: #e4edf3;
      --card: #ffffff;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --page: #eef3f6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #fff;
      color: var(--ink);
    }
    .shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .top {
      background: linear-gradient(165deg, #0f3d4c 0%, #0f766e 100%);
      color: #fff;
      padding: 28px 20px 36px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(255,255,255,0.16);
      display: grid; place-items: center;
      font-weight: 800; letter-spacing: 0.02em;
    }
    .eyebrow { margin: 0; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.78; }
    h1 { margin: 2px 0 0; font-size: 1.35rem; line-height: 1.25; font-weight: 700; }
    .intro { margin: 14px 0 0; color: rgba(255,255,255,0.86); font-size: 0.95rem; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 18px 0;
    }
    form, .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card);
      padding: 8px 0 12px;
    }
    .fill { flex: 1; }
    label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
    input {
      width: 100%; border: 1px solid var(--line); background: #f8fbfc;
      border-radius: 12px; padding: 12px 14px; font-size: 1rem; color: var(--ink);
    }
    input:focus { outline: 2px solid rgba(15, 118, 110, 0.25); border-color: var(--teal); }
    button {
      width: 100%; margin-top: 16px; border: 0; border-radius: 12px;
      padding: 13px; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    .primary { background: var(--teal); color: #fff; }
    .primary:active { background: var(--teal-dark); }
    .ghost { background: #f3f7f8; color: var(--ink); margin-top: 8px; }
    .error { color: #b42318; font-weight: 700; min-height: 1.2em; margin-top: 8px; }
    .person { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 52px; height: 52px; border-radius: 16px; flex: 0 0 auto;
      background: #e6f4f2; color: var(--teal-dark);
      display: grid; place-items: center; font-size: 1.2rem; font-weight: 800;
    }
    .person h2 { margin: 0; font-size: 1.15rem; }
    .person p { margin: 3px 0 0; color: var(--muted); font-size: 0.88rem; }
    .pill {
      margin-left: auto; border-radius: 999px; padding: 6px 10px;
      font-size: 0.75rem; font-weight: 800; white-space: nowrap;
    }
    .present { background: #e8f7ee; color: #157a3b; }
    .absent { background: #fdecec; color: #b42318; }
    .out { background: #e7f1fb; color: #175cd3; }
    .leave { background: #fff6e5; color: #b54708; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
    .stat { background: #f6fafb; border-radius: 14px; padding: 12px 10px; }
    .stat span { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 700; }
    .stat strong { display: block; margin-top: 4px; font-size: 0.95rem; }
    .rows { margin-top: 8px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row span { color: var(--muted); }
    .row strong { text-align: right; }
    .footer {
      padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
      text-align: center;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }
    .footer strong { color: var(--teal-dark); font-weight: 700; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">Q</div>
        <div>
          <p class="eyebrow">QuantEye</p>
          <h1 id="companyName">Attendance</h1>
        </div>
      </div>
      <p class="intro" id="intro">Opening your attendance…</p>
    </header>
    <main>
      <form id="loginForm" hidden>
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="username" placeholder="name@company.com" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <div class="error" id="loginError"></div>
        <div class="fill"></div>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <section id="attendanceCard" class="card" hidden>
        <div class="person">
          <div class="avatar" id="empInitial">Q</div>
          <div>
            <h2 id="empName"></h2>
            <p id="empRole"></p>
          </div>
          <strong id="empStatus" class="pill"></strong>
        </div>
        <div class="stats">
          <div class="stat"><span>Check-in</span><strong id="empIn"></strong></div>
          <div class="stat"><span>Check-out</span><strong id="empOut"></strong></div>
          <div class="stat"><span>Worked</span><strong id="empWorked"></strong></div>
        </div>
        <div class="rows">
          <div class="row"><span>Designation</span><strong id="empDesignation"></strong></div>
          <div class="row"><span>Department</span><strong id="empDepartment"></strong></div>
          <div class="row"><span>Shift</span><strong id="empShift"></strong></div>
        </div>
        <div class="fill"></div>
        <button class="primary" type="button" id="refreshButton">Refresh</button>
        <button class="ghost" type="button" id="logoutButton">Log out</button>
      </section>
    </main>
    <footer class="footer">
      <div>Powered by <strong>QIntellect Technologies</strong></div>
      <div>© 2026 QIntellect Technologies. All rights reserved.</div>
    </footer>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const attendanceCard = document.getElementById('attendanceCard');
    const loginError = document.getElementById('loginError');

    function showText(id, value) {
      document.getElementById(id).textContent = value || '—';
    }

    function prettyDate(value) {
      if (!value) return 'Today';
      const parsed = new Date(String(value).slice(0, 10) + 'T00:00:00');
      if (Number.isNaN(parsed.getTime())) return 'Today';
      return parsed.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function statusClass(status) {
      if (status === 'Present') return 'pill present';
      if (status === 'Checked Out') return 'pill out';
      if (status === 'On Leave') return 'pill leave';
      return 'pill absent';
    }

    function showLogin() {
      loginForm.hidden = false;
      attendanceCard.hidden = true;
      document.getElementById('companyName').textContent = 'Attendance';
      document.getElementById('intro').textContent = 'Sign in with your work email.';
    }

    function showCard(card) {
      const status = card.status || 'Absent';
      const role = [card.designation, card.department].filter(Boolean).join(' · ');
      const shift = [card.shift_name, card.shift_timing].filter(Boolean).join(' · ');
      const initial = (card.name || 'Q').trim().charAt(0).toUpperCase();
      loginForm.hidden = true;
      attendanceCard.hidden = false;
      document.getElementById('companyName').textContent = card.company || 'My Attendance';
      document.getElementById('intro').textContent = prettyDate(card.date);
      document.getElementById('empInitial').textContent = initial;
      showText('empName', card.name);
      showText('empRole', role);
      showText('empDesignation', card.designation);
      showText('empDepartment', card.department);
      showText('empShift', shift);
      showText('empIn', card.check_in);
      showText('empOut', card.check_out);
      showText('empWorked', card.working_time);
      const statusEl = document.getElementById('empStatus');
      statusEl.textContent = status;
      statusEl.className = statusClass(status);
    }

    async function showAttendance() {
      const response = await fetch('/api/mobile/today', { credentials: 'same-origin' });
      const data = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        showLogin();
        return;
      }
      showCard(data.attendance || {});
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.textContent = '';
      const response = await fetch('/api/mobile/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        loginError.textContent = data.message || 'Login failed.';
        return;
      }
      showAttendance();
    });

    document.getElementById('refreshButton').addEventListener('click', showAttendance);
    document.getElementById('logoutButton').addEventListener('click', async () => {
      await fetch('/api/mobile/logout', { method: 'POST', credentials: 'same-origin' });
      showLogin();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/m/sw.js').catch(function() {});
    }
    showAttendance();
  </script>
</body>
</html>
